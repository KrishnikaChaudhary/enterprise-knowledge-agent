[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "1.0.0"
description = "RAG knowledge agent over structured and unstructured data: hybrid retrieval, access control, cited and verified answers, LLM-native tracing, evaluation harness, Cloud Run deploy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # runtime is standard-library only

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]
adk = ["google-adk"]

[project.scripts]
kagent = "kagent.cli:main"
kagent-server = "kagent.server:main"
kagent-eval = "kagent.evalrun:main"

[tool.setuptools.packages.find]
include = ["kagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
